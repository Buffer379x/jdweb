name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub Release
  packages: write # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: |
          version=${GITHUB_REF_NAME#v}
          if [ "$version" != "$(cat VERSION)" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the VERSION file ($(cat VERSION))."
            exit 1
          fi
          # Release notes: the section of this version in CHANGELOG.md, up to the next one.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]") == 4) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section '## [$version]' with content."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and smoke test (amd64)
        run: |
          docker build --build-arg VERSION=${{ steps.v.outputs.version }} -t jdweb:release .
          scripts/smoke-test.sh jdweb:release
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            SOURCE=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "JDWeb ${{ steps.v.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
