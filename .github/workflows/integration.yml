# Integration tests against a real JDownloader (jlesage/jdownloader-2:latest):
# every package of the tests is named "jdweb-it-...", and the stack is thrown
# away afterwards. Weekly, to see when a new JDownloader changes its API.
name: Integration

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:
    inputs:
      big:
        description: "Also run the 10,000 links case (T-LG-01), takes long"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  integration:
    name: JDownloader latest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start the test stack
        run: bash scripts/teststack.sh up
      - name: Integration tests
        shell: bash # with pipefail, so that a failing test fails the step
        env:
          JDWEB_IT_BIG: ${{ inputs.big && '1' || '' }}
        run: |
          JDWEB_TEST_JD_URL="$(bash scripts/teststack.sh url)" \
            go test -tags integration -count=1 -timeout 80m -v ./test/integration/ 2>&1 | tee integration.log
      - name: Summary
        if: always()
        run: |
          {
            echo '### Integration tests'
            echo '```'
            grep -E '^(--- |ok|FAIL|PASS)' integration.log | head -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log of the JDownloader container
        if: failure()
        run: docker logs --tail 200 jdweb-test-jd 2>&1 | tail -n 200
      - name: Tear the stack down
        if: always()
        run: bash scripts/teststack.sh down
